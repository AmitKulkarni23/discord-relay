# Checks formatting and the rules of React hooks, typechecks and tests every push and pull request.
# Railway's "Wait for CI" holds each deploy until this workflow passes.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      # Fails if any file drops below the per-file floor in bunfig.toml.
      - run: bun run test --coverage
      # Reports known vulnerabilities but never fails the build; Dependabot opens the fix PRs.
      - name: Audit dependencies (report only)
        run: bun audit
        continue-on-error: true
