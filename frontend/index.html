<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0D0E11" />
    <meta name="description" content="A Discord channel, relayed live." />
    <title>DiscordRelay</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D0E11'/%3E%3Ccircle cx='10' cy='22' r='3' fill='%23A493F7'/%3E%3Cpath d='M9 13a10 10 0 0 1 10 10M9 7a16 16 0 0 1 16 16' fill='none' stroke='%23A493F7' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!-- Paint the reader's theme before React mounts, so the page never flashes the wrong one. Colours match theme.ts. -->
    <style>
      html {
        background: #0d0e11;
      }
      html[data-color-scheme='light'] {
        background: #f7f8fa;
      }
      body {
        margin: 0;
      }
    </style>
    <script>
      try {
        const stored = localStorage.getItem('mui-mode')
        const scheme = stored === 'dark' || stored === 'light' ? stored : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.setAttribute('data-color-scheme', scheme)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
